name: Desktop apps

# Builds the Tauri desktop shell for macOS (universal: Apple Silicon + Intel)
# and Windows, then attaches the installers to a public GitHub Release.
# Trigger: push a tag like `desktop-v0.1.0`, or run manually from the Actions tab.
on:
  push:
    tags: ["desktop-v*"]
  workflow_dispatch:

permissions:
  contents: write # create the release + upload installers

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target universal-apple-darwin
          - platform: windows-latest
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          # Both Mac architectures so one .dmg runs on M-series and Intel Macs.
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target

      - name: Install Tauri CLI
        working-directory: desktop
        run: npm install

      - name: Generate app icons (.icns / .ico / png) from the 1024px source
        working-directory: desktop
        run: npm run icons

      # Optional Apple signing + notarization. Variables are exported ONLY when
      # the secrets exist: an empty APPLE_CERTIFICATE still counts as "set",
      # and Tauri then fails trying to import an empty certificate.
      - name: Configure Apple signing (only if secrets are present)
        if: matrix.platform == 'macos-latest'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$APPLE_CERTIFICATE" ]; then
            for v in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
              echo "$v=${!v}" >> "$GITHUB_ENV"
            done
            echo "Apple signing enabled."
          else
            echo "No Apple certificate configured — building an unsigned (ad-hoc signed) app."
          fi

      - name: Build installers + publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: desktop
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || 'desktop-v__VERSION__' }}
          releaseName: "Galaxus Desktop v__VERSION__"
          releaseBody: |
            Desktop app for Galaxus — opens your account in its own window.

            **Mac:** download the `.dmg`, drag Galaxus to Applications. First launch: if macOS says it can't check the app, open **System Settings → Privacy & Security → Open Anyway** (one time).
            **Windows:** download the `-setup.exe`. If SmartScreen appears, click **More info → Run anyway** (one time).

            Prefer zero warnings? Install from the browser instead: https://project-galaxus.vercel.app/install
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
