[package]
name = "galaxus"
version = "0.1.1"
description = "Galaxus desktop app"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
# Activity tracking (see src/main.rs): which app is in front, and how long since the last input.
active-win-pos-rs = "0.11"
user-idle = "0.6"

# Small, fast release binaries.
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
